[project]
name = "pokemon-tcg-ai-battle"
version = "0.1.0"
description = "Reproducible PTCG AI Battle agent research workspace"
requires-python = ">=3.11,<3.14"
dependencies = [
    "jupyterlab>=4.0",
    "kaggle>=2.2.4,<3",
    "kaggle-environments==1.32.3",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

